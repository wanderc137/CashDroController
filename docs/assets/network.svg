<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Topología de red aislada entre el PC y el CashDro</title>
  <desc id="descripcion">El PC de control y el CashDro se conectan a un switch dedicado en la subred 192.168.1.0/24, sin gateway ni salida a Internet. El PC inicia HTTPS al puerto 443 del equipo.</desc>

  <defs>
    <style>
      .bg     { fill: #0b1220; }
      .panel  { fill: #111a2b; stroke: #24344f; stroke-width: 1.5; }
      .card   { fill: #16233a; stroke: #2b3d5c; stroke-width: 1.2; }
      .cardg  { fill: #10281f; stroke: #1f6f52; stroke-width: 1.2; }
      .cardr  { fill: #2a1418; stroke: #7f2d34; stroke-width: 1.2; }
      .t      { fill: #e6edf7; font-family: 'Segoe UI', Arial, sans-serif; }
      .m      { fill: #8ba3c7; font-family: 'Segoe UI', Arial, sans-serif; }
      .k      { fill: #38bdf8; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .g      { fill: #34d399; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .r      { fill: #f87171; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .a      { fill: #fbbf24; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .mono   { fill: #c7d6ee; font-family: 'Cascadia Mono', 'Consolas', monospace; }
      .line   { stroke: #38bdf8; stroke-width: 2.2; fill: none; }
      .dash   { stroke: #3b5170; stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; }
      .red    { stroke: #f87171; stroke-width: 1.6; fill: none; }
      .chip   { fill: #0b1220; stroke: #2b3d5c; }
    </style>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>

  <text class="t" x="48" y="56" font-size="26" font-weight="700" letter-spacing="0.4">Topología de red aislada</text>
  <text class="m" x="48" y="82" font-size="14">PC de control y CashDro en un segmento dedicado, sin salida a Internet</text>
  <line x1="48" y1="98" x2="1152" y2="98" stroke="#24344f" stroke-width="1.5"/>

  <!-- Internet tachada -->
  <g opacity="0.95">
    <rect class="cardr" x="936" y="24" width="216" height="58" rx="12" stroke-dasharray="6 4"/>
    <text class="r" x="1044" y="48" font-size="12" font-weight="600" text-anchor="middle">SIN SALIDA A INTERNET</text>
    <text class="m" x="1044" y="68" font-size="10" text-anchor="middle">ni red corporativa general</text>
  </g>

  <!-- Frontera -->
  <rect class="dash" x="48" y="120" width="1104" height="416" rx="18"/>
  <text class="a" x="72" y="148" font-size="12" letter-spacing="2">SEGMENTO AISLADO · 192.168.1.0/24</text>
  <text class="m" x="1130" y="148" font-size="11" text-anchor="end">sin gateway · sin DNS</text>

  <!-- PC -->
  <rect class="card" x="96" y="236" width="260" height="200" rx="14"/>
  <text class="k" x="118" y="266" font-size="12" letter-spacing="1.5">PC DE CONTROL</text>
  <text class="t" x="118" y="294" font-size="16" font-weight="600">Windows 10 / 11</text>
  <text class="mono" x="118" y="320" font-size="13">192.168.1.10/24</text>
  <line x1="118" y1="334" x2="334" y2="334" stroke="#2b3d5c"/>
  <text class="m" x="118" y="356" font-size="11">main.py · CashDroAPI</text>
  <text class="m" x="118" y="376" font-size="11">Cliente HTTPS (inicia)</text>
  <text class="m" x="118" y="396" font-size="11">Firewall: salida a 443</text>
  <rect class="chip" x="118" y="408" width="86" height="18" rx="4"/>
  <text class="mono" x="161" y="421" font-size="9" text-anchor="middle">eth0 / RJ45</text>

  <!-- Switch -->
  <rect class="card" x="512" y="286" width="176" height="104" rx="12"/>
  <text class="t" x="600" y="318" font-size="16" font-weight="600" text-anchor="middle">Switch</text>
  <text class="m" x="600" y="340" font-size="11" text-anchor="middle">capa 2 · dedicado</text>
  <text class="m" x="600" y="358" font-size="11" text-anchor="middle">o VLAN aislada</text>
  <g fill="#38bdf8">
    <rect x="546" y="370" width="10" height="8" rx="1"/>
    <rect x="562" y="370" width="10" height="8" rx="1"/>
    <rect x="578" y="370" width="10" height="8" rx="1"/>
    <rect x="594" y="370" width="10" height="8" rx="1"/>
    <rect x="610" y="370" width="10" height="8" rx="1"/>
    <rect x="626" y="370" width="10" height="8" rx="1"/>
    <rect x="642" y="370" width="10" height="8" rx="1"/>
  </g>

  <!-- CashDro -->
  <rect class="cardg" x="856" y="220" width="252" height="232" rx="14"/>
  <text class="g" x="878" y="250" font-size="12" letter-spacing="1.5">DISPOSITIVO</text>
  <text class="t" x="878" y="278" font-size="17" font-weight="600">CashDro</text>
  <text class="mono" x="878" y="304" font-size="13">192.168.1.50/24</text>
  <line x1="878" y1="318" x2="1086" y2="318" stroke="#1f6f52"/>
  <text class="m" x="878" y="340" font-size="11">Servidor HTTPS embebido</text>
  <text class="m" x="878" y="360" font-size="11">Cashdro3WS/index3.php</text>
  <text class="m" x="878" y="380" font-size="11">Certificado autofirmado</text>
  <text class="m" x="878" y="400" font-size="11">Un cliente simultáneo</text>
  <rect class="chip" x="878" y="414" width="112" height="18" rx="4"/>
  <text class="mono" x="934" y="427" font-size="9" text-anchor="middle">443/tcp · eth0</text>

  <!-- Enlaces -->
  <line class="line" x1="356" y1="336" x2="508" y2="336" marker-end="url(#ab)"/>
  <text class="k" x="432" y="326" font-size="10" text-anchor="middle">RJ45</text>
  <line class="line" x1="688" y1="336" x2="852" y2="336" marker-end="url(#ab)"/>
  <text class="k" x="770" y="326" font-size="10" text-anchor="middle">HTTPS · 443</text>

  <!-- Iniciativa del PC -->
  <text class="m" x="600" y="500" font-size="10" text-anchor="middle">la iniciativa siempre es del PC; el CashDro nunca abre conexiones</text>

  <!-- Tarjetas inferiores -->
  <rect class="panel" x="48" y="566" width="344" height="104" rx="12"/>
  <text class="a" x="70" y="594" font-size="12" font-weight="600">Aislamiento físico</text>
  <text class="m" x="70" y="616" font-size="11">Switch dedicado o VLAN sin ruta</text>
  <text class="m" x="70" y="636" font-size="11">hacia la red de tienda.</text>
  <text class="m" x="70" y="656" font-size="11">Sin puerto de enlace ascendente.</text>

  <rect class="panel" x="412" y="566" width="344" height="104" rx="12"/>
  <text class="a" x="434" y="594" font-size="12" font-weight="600">Superficie mínima</text>
  <text class="m" x="434" y="616" font-size="11">El controlador no escucha puertos.</text>
  <text class="m" x="434" y="636" font-size="11">Sólo abre conexiones salientes</text>
  <text class="m" x="434" y="656" font-size="11">al 443 del CashDro.</text>

  <rect class="panel" x="776" y="566" width="344" height="104" rx="12"/>
  <text class="r" x="798" y="594" font-size="12" font-weight="600">Tráfico sensible</text>
  <text class="m" x="798" y="616" font-size="11">Credenciales en la query string:</text>
  <text class="m" x="798" y="636" font-size="11">TLS las cifra, pero no deben salir</text>
  <text class="m" x="798" y="656" font-size="11">del segmento.</text>

  <text class="m" x="48" y="700" font-size="10">Direcciones de ejemplo. Sustituye 192.168.1.50 por la IP real de tu equipo y mantén el PC en la misma subred.</text>
</svg>
