<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura de CashDroController</title>
  <desc id="descripcion">Diagrama de capas: un PC Windows ejecuta cuatro módulos Python y se comunica por HTTPS con el servidor embebido de un CashDro, que controla el hardware de efectivo.</desc>

  <defs>
    <style>
      .bg      { fill: #0b1220; }
      .panel   { fill: #111a2b; stroke: #24344f; stroke-width: 1.5; }
      .panel2  { fill: #0e1728; stroke: #24344f; stroke-width: 1; }
      .card    { fill: #16233a; stroke: #2b3d5c; stroke-width: 1.2; }
      .cardalt { fill: #131f34; stroke: #2b3d5c; stroke-width: 1.2; }
      .t       { fill: #e6edf7; font-family: 'Segoe UI', Arial, sans-serif; }
      .m       { fill: #8ba3c7; font-family: 'Segoe UI', Arial, sans-serif; }
      .k       { fill: #38bdf8; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .g       { fill: #34d399; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .a       { fill: #fbbf24; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .r       { fill: #f87171; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
      .mono    { fill: #c7d6ee; font-family: 'Cascadia Mono', 'Consolas', monospace; }
      .line    { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .line2   { stroke: #34d399; stroke-width: 2; fill: none; }
      .dash    { stroke: #3b5170; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
      .tag     { fill: #0b1220; stroke: #2b3d5c; }
    </style>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="flg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="800"/>

  <!-- Encabezado -->
  <text class="t" x="48" y="58" font-size="26" font-weight="700" letter-spacing="0.4">CashDroController — Arquitectura</text>
  <text class="m" x="48" y="84" font-size="14">Consola Python en Windows · cliente REST HTTPS · dispositivo CashDro</text>
  <line x1="48" y1="100" x2="1152" y2="100" stroke="#24344f" stroke-width="1.5"/>

  <!-- Panel PC -->
  <rect class="panel" x="48" y="124" width="470" height="596" rx="18"/>
  <text class="k" x="72" y="160" font-size="13" letter-spacing="2">PC DEL OPERADOR</text>
  <text class="t" x="72" y="184" font-size="17" font-weight="600">Windows 10 / 11</text>
  <text class="m" x="72" y="205" font-size="12">Python 3.8+ · única dependencia: requests</text>

  <rect class="card" x="72" y="224" width="422" height="82" rx="10"/>
  <text class="mono" x="90" y="252" font-size="15" font-weight="700">main.py</text>
  <text class="m" x="90" y="274" font-size="12">Menú, flujo de cobro y anulación, señales SIGINT</text>
  <text class="m" x="90" y="292" font-size="12">Orquesta la API y la consola. No hace HTTP.</text>

  <rect class="card" x="72" y="318" width="422" height="82" rx="10"/>
  <text class="mono" x="90" y="346" font-size="15" font-weight="700">cashdro_api.py</text>
  <text class="m" x="90" y="368" font-size="12">GET HTTPS · reintentos · normalización de JSON</text>
  <text class="m" x="90" y="386" font-size="12">CashDroAPI y CashDroError. No imprime nada.</text>

  <rect class="card" x="72" y="412" width="422" height="82" rx="10"/>
  <text class="mono" x="90" y="440" font-size="15" font-weight="700">cashdro_cli.py</text>
  <text class="m" x="90" y="462" font-size="12">Entrada/salida · colores ANSI · formato de resultados</text>
  <text class="m" x="90" y="480" font-size="12">Validación de importes. No hace peticiones.</text>

  <rect class="cardalt" x="72" y="506" width="422" height="72" rx="10"/>
  <text class="mono" x="90" y="532" font-size="15" font-weight="700">config.py</text>
  <text class="m" x="90" y="554" font-size="12">Host · credenciales · timeouts · códigos · POS</text>

  <!-- Operador -->
  <rect class="panel2" x="72" y="612" width="422" height="82" rx="10"/>
  <circle cx="104" cy="653" r="14" fill="none" stroke="#8ba3c7" stroke-width="1.6"/>
  <path d="M 96 668 q 8 -12 16 0" fill="none" stroke="#8ba3c7" stroke-width="1.6"/>
  <text class="t" x="132" y="646" font-size="14" font-weight="600">Operador / cajero</text>
  <text class="m" x="132" y="668" font-size="12">Teclea importes, confirma anulaciones, lee el estado</text>

  <!-- Enlace -->
  <line class="line" x1="520" y1="386" x2="676" y2="386" marker-end="url(#fl)"/>
  <line class="line2" x1="676" y1="470" x2="520" y2="470" marker-end="url(#flg)"/>
  <text class="k" x="598" y="360" font-size="12" text-anchor="middle" font-weight="600">petición GET</text>
  <text class="m" x="598" y="378" font-size="11" text-anchor="middle">query params</text>
  <text class="g" x="598" y="500" font-size="12" text-anchor="middle" font-weight="600">respuesta JSON</text>
  <text class="m" x="598" y="518" font-size="11" text-anchor="middle">code / response</text>
  <rect class="tag" x="524" y="536" width="148" height="46" rx="8"/>
  <text class="a" x="598" y="555" font-size="11" text-anchor="middle" font-weight="600">TLS autofirmado</text>
  <text class="m" x="598" y="572" font-size="11" text-anchor="middle">verify = False</text>
  <text class="m" x="598" y="604" font-size="10" text-anchor="middle">puerto 443</text>

  <!-- Panel CashDro -->
  <rect class="panel" x="682" y="124" width="470" height="596" rx="18"/>
  <text class="g" x="706" y="160" font-size="13" letter-spacing="2">DISPOSITIVO CASHDRO</text>
  <text class="t" x="706" y="184" font-size="17" font-weight="600">Reciclador de efectivo</text>
  <text class="m" x="706" y="205" font-size="12">IP de ejemplo 192.168.1.50 · RJ45</text>

  <rect class="card" x="706" y="224" width="422" height="96" rx="10"/>
  <text class="mono" x="724" y="252" font-size="15" font-weight="700">Cashdro3WS/index3.php</text>
  <text class="m" x="724" y="274" font-size="12">Servidor web embebido · HTTPS</text>
  <text class="m" x="724" y="292" font-size="12">Autenticación name + password por petición</text>
  <text class="m" x="724" y="310" font-size="12">Sin sesiones, sin cookies, sin callbacks</text>

  <rect class="card" x="706" y="332" width="422" height="96" rx="10"/>
  <text class="t" x="724" y="358" font-size="14" font-weight="600">Controlador de operaciones</text>
  <text class="m" x="724" y="380" font-size="12">startOperation · acknowledge · askOperation</text>
  <text class="m" x="724" y="398" font-size="12">Estados I / Q / E / F · withError</text>
  <text class="m" x="724" y="416" font-size="12">Códigos -1, -3, -1900, -998, -999</text>

  <rect class="cardalt" x="706" y="440" width="422" height="190" rx="10"/>
  <text class="t" x="724" y="466" font-size="14" font-weight="600">Hardware</text>
  <line x1="724" y1="476" x2="1110" y2="476" stroke="#2b3d5c"/>
  <circle cx="734" cy="500" r="3.5" fill="#38bdf8"/>
  <text class="m" x="748" y="504" font-size="12">Transporte por rodillos y encoder</text>
  <circle cx="734" cy="528" r="3.5" fill="#38bdf8"/>
  <text class="m" x="748" y="532" font-size="12">Sensores CIS, IR, UV, magnéticos y de espesor</text>
  <circle cx="734" cy="556" r="3.5" fill="#38bdf8"/>
  <text class="m" x="748" y="560" font-size="12">Validación de monedas por inducción</text>
  <circle cx="734" cy="584" r="3.5" fill="#38bdf8"/>
  <text class="m" x="748" y="588" font-size="12">Cassettes de billetes y tolvas de monedas</text>
  <circle cx="734" cy="612" r="3.5" fill="#38bdf8"/>
  <text class="m" x="748" y="616" font-size="12">Pantalla, cerradura y reciclaje de cambio</text>

  <rect class="panel2" x="706" y="650" width="422" height="48" rx="8"/>
  <text class="m" x="722" y="670" font-size="10">El estado de cada operación vive en el equipo:</text>
  <text class="mono" x="722" y="688" font-size="10">operationId + askOperation</text>

  <!-- Nota inferior -->
  <rect class="panel2" x="48" y="740" width="1104" height="40" rx="8"/>
  <text class="a" x="66" y="765" font-size="12" font-weight="600">Clave:</text>
  <text class="m" x="122" y="765" font-size="12">el PC siempre inicia la conexión; el CashDro nunca llama al PC. El estado de cada operación vive en el equipo, no en el cliente.</text>
</svg>
